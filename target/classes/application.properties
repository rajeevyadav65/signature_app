# ===========================
# Server Configuration
# ===========================
server.port=8083
server.servlet.context-path=/

# ===========================
# ===========================
# H2 Database Configuration
# ===========================
spring.datasource.url=jdbc:h2:mem:signature_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Set Hibernate dialect specifically for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable the H2 Web Console (Access at http://localhost:8083/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Keep your existing JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
# JWT Configuration
# ===========================
app.jwt.secret=4a8b3c2d1e5f6a7b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ===========================
# File Upload Configuration
# ===========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.file.upload-dir=./uploads

# ===========================
# Email Configuration (Gmail SMTP - update credentials)
# ===========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===========================
# App Base URL (for signature links)
# ===========================
app.base-url=${APP_BASE_URL:http://localhost:${server.port}}

# ===========================
# Logging
# ===========================
logging.level.com.signatureapp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===========================
# Jackson / JSON
# ===========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
